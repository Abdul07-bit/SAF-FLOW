<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAF Flow - offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; background: #031527; color: #e3edf2; }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
  p { color: #8fa8ba; line-height: 1.5; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: .6rem; background: #017f7c; color: #fff; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>SAF Flow needs an internet connection to load your business data. Check the connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
