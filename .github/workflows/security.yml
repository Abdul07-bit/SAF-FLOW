# SAF Flow security gates. Runs on every push / pull request and nightly.
#
# Blocks the merge / deployment on: failing tests (including the tenant
# isolation, permission and payment security suites), leaked secrets, unsafe
# migrations, HIGH/CRITICAL vulnerabilities in production dependencies or the
# container image, and Semgrep ERROR findings. Nothing is silently ignored:
# advisory-only results (dev dependencies, CodeQL) are uploaded and visible.
#
# Third-party actions are pinned to release tags; pin them to commit SHAs when
# you adopt this workflow (Settings > Actions > "Require actions pinned to SHA").

name: security

on:
  push:
    branches: [main, staging, "security/**"]
  pull_request:
  schedule:
    - cron: "30 1 * * *" # nightly: catches newly published CVEs
  workflow_dispatch:
    inputs:
      zap_target:
        description: "Authorised STAGING URL for an OWASP ZAP baseline scan (leave empty to skip). Never production."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (unit, integration, tenant isolation, permissions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saf_owner
          POSTGRES_PASSWORD: saf_owner_dev_password
          POSTGRES_DB: saf
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U saf_owner -d saf" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: saf_owner_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Create the least-privilege runtime role and the test database
        run: |
          psql -h localhost -p 5433 -U saf_owner -d saf -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE saf_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'saf_app_dev_password';
          CREATE DATABASE saf_test OWNER saf_owner;
          GRANT CONNECT ON DATABASE saf_test TO saf_app;
          SQL
          psql -h localhost -p 5433 -U saf_owner -d saf_test -c "GRANT USAGE ON SCHEMA public TO saf_app;"
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Migration safety
        run: node scripts/check-migrations.mjs
      - name: Test suite (fails the build on any failure)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results.xml }

  # Secret scanning runs in its own workflow: .github/workflows/gitleaks.yml

  dependencies:
    name: Dependencies (npm audit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Production dependencies - block on HIGH/CRITICAL
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies - report (dev tooling, not shipped)
        run: npm audit || echo "::warning::Development dependencies have advisories - see the log above. They are not shipped to production but should be updated."
      - name: Trivy filesystem scan (vulnerabilities, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,storage-test
          exit-code: "1"

  container:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t saf-flow:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: saf-flow:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep:1.95.0 }
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (blocks on ERROR findings)
        run: semgrep scan --config p/typescript --config p/react --config p/nextjs --config p/owasp-top-ten --config p/secrets --severity ERROR --error --metrics=off

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  dast:
    name: OWASP ZAP baseline (manual, staging only)
    if: github.event_name == 'workflow_dispatch' && inputs.zap_target != ''
    runs-on: ubuntu-latest
    steps:
      # The input is passed through an environment variable, never interpolated
      # into the script, so it cannot inject shell commands.
      - name: Refuse anything that looks like production
        env:
          ZAP_TARGET: ${{ inputs.zap_target }}
        run: |
          if ! printf '%s' "$ZAP_TARGET" | grep -Eq '^https?://[A-Za-z0-9.-]*(staging|localhost|127\.0\.0\.1)[A-Za-z0-9.-]*(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'; then
            echo "::error::ZAP may only scan an authorised staging URL (host must contain 'staging')."
            exit 1
          fi
      - name: ZAP baseline (passive scan)
        env:
          ZAP_TARGET: ${{ inputs.zap_target }}
        run: docker run --rm -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$ZAP_TARGET" -I
