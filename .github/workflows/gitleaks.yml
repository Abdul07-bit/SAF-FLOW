# Secret scanning with Gitleaks on every push, pull request and nightly.
# Scans the full git history; findings fail the run. The only reviewed
# exception (test fixtures) is documented in .gitleaks.toml.
#
# Personal GitHub accounts need no licence. If this repository moves to a
# GitHub organization, add a GITLEAKS_LICENSE secret (free from gitleaks.io).

name: gitleaks

on:
  push:
  pull_request:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # lets the action comment on the PR line that leaked

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
