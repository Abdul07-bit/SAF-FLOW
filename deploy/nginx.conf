# SMARTAUTO FLEX reverse proxy (mounted at /etc/nginx/conf.d/default.conf).
#
# This file serves plain HTTP on port 80 so the stack works out of the box.
# For production, terminate TLS here (see docs/DEPLOYMENT.md > HTTPS) or in
# front of this container, and set APP_URL to the https:// address.

# Coarse per-IP limits; the application has its own finer limits per route.
limit_req_zone $binary_remote_addr zone=saf_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=saf_login:10m rate=20r/m;

upstream saf_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 5m;          # logo / employee photo uploads are capped at 2 MB by the app
  client_body_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # Overwrite (never append) the client address: the app uses it for audit
  # logs and rate limiting, so a caller must not be able to supply its own.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  location = /api/auth/login {
    limit_req zone=saf_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://saf_app;
  }

  # The scheduled job is called by the cron container on the internal network only.
  location = /api/jobs/renewals {
    return 404;
  }

  location /api/ {
    limit_req zone=saf_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://saf_app;
  }

  location /_next/static/ {
    proxy_pass http://saf_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://saf_app;
  }
}
